name: LeonBusLive
options:
  bundleIdPrefix: es.leonbus
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: es
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0.0"
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  LeonBusLive:
    type: application
    platform: iOS
    sources:
      - path: LeonBusLive
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.leonbus.live
        PRODUCT_NAME: LeonBusLive
        INFOPLIST_KEY_CFBundleDisplayName: León Bus Live
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.navigation
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: León Bus Live usa tu ubicación para mostrar paradas cercanas y estimar distancias a pie. Los datos de demostración no son oficiales.
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: León Bus Live puede actualizar paradas cercanas en segundo plano solo si lo permites. Los datos de demostración no son oficiales.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    info:
      path: LeonBusLive/Resources/Info.plist
      properties:
        CFBundleDisplayName: León Bus Live
        UIBackgroundModes:
          - location
        NSLocationWhenInUseUsageDescription: León Bus Live usa tu ubicación para mostrar paradas cercanas y estimar distancias a pie. Los datos de demostración no son oficiales.
        NSLocationAlwaysAndWhenInUseUsageDescription: León Bus Live puede actualizar paradas cercanas en segundo plano solo si lo permites. Los datos de demostración no son oficiales.
  LeonBusLiveTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LeonBusLiveTests
    dependencies:
      - target: LeonBusLive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.leonbus.live.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LeonBusLive.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/LeonBusLive"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  LeonBusLive:
    build:
      targets:
        LeonBusLive: all
        LeonBusLiveTests: [test]
    test:
      targets:
        - LeonBusLiveTests
    run:
      config: Debug
